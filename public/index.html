<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Classmates Shared Courses</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 2rem;
            }
            table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 1rem;
            }
            th,
            td {
                border: 1px solid #ccc;
                padding: 0.5rem;
                text-align: left;
            }
            th {
                background-color: #f4f4f4;
            }
            tr:nth-child(even) {
                background-color: #fafafa;
            }
        </style>
    </head>
    <body>
        <h1>Shared Courses</h1>
        <input id="termInput" placeholder="Enter term/year code e.g. 1251" />
        <button onclick="loadClassmates()">Load</button>

        <table id="results">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Shared Count</th>
                    <th>Courses</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <script>
            async function loadClassmates() {
                const term = document.getElementById("termInput").value;
                console.log("Sending termYearCode:", term); // log for debugging

                const response = await fetch("/api/classmates", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ termYearCode: term }),
                });

                if (!response.ok) {
                    console.error("Fetch error:", response.statusText);
                    return;
                }

                const data = await response.json();
                console.log("Received data:", data); // log for debugging

                const tbody = document.querySelector("#results tbody");
                tbody.innerHTML = "";
                data.forEach((c) => {
                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${c.name}</td><td>${c.sharedCount}</td><td>${c.sharedCourses.join(", ")}</td>`;
                    tbody.appendChild(row);
                });
            }
        </script>
    </body>
</html>
