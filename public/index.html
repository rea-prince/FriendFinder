<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous"
        />
        <link
            href="https://bootswatch.com/5/brite/bootstrap.min.css"
            rel="stylesheet"
            type="text/css"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
            integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
            crossorigin="anonymous"
        ></script>
        <title>Classmates Shared Courses</title>
    </head>
    <body>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img
                        src="https://www.svgrepo.com/show/299039/group-team.svg"
                        alt="Logo"
                        width="30"
                        height="30"
                        class="d-inline-block align-text-top"
                    />
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarColor01"
                    aria-controls="navbarColor01"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarColor01">
                    <ul class="navbar-nav me-auto">
                        <li><span class="nav-link">Friend Finder</span></li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a
                                class="nav-link d-flex align-items-center gap-2 text-white"
                                href="https://github.com/rea-prince/Friend-Finder"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                <img
                                    src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg"
                                    alt="GitHub"
                                    width="24"
                                    height="24"
                                    style="filter: invert(1)"
                                />
                                GitHub
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container my-4">
            <div class="d-flex gap-2 input-group mb-3">
                <span class="input-group-text" id="inputGroup-sizing-default"
                    >Enter a year and term</span
                >
                <input
                    type="text"
                    id="termInput"
                    class="form-control"
                    placeholder="i.e. 1252 for A.Y. '25-'26, term 2"
                    aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-default"
                />
                <button onclick="loadClassmates()" class="btn btn-info">
                    Load
                </button>
            </div>

            <table class="table table-striped" id="results">
                <thead style="white-space: nowrap">
                    <tr>
                        <th>Name</th>
                        <th>Shared Count</th>
                        <th>Courses</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <script>
                async function loadClassmates() {
                    const term = document.getElementById("termInput").value;
                    console.log("Sending termYearCode:", term); // log for debugging

                    const response = await fetch("/api/classmates", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ termYearCode: term }),
                    });

                    if (!response.ok) {
                        console.error("Fetch error:", response.statusText);
                        return;
                    }

                    const data = await response.json();
                    console.log("Received data:", data); // log for debugging

                    const tbody = document.querySelector("#results tbody");
                    tbody.innerHTML = "";
                    data.forEach((c) => {
                        const row = document.createElement("tr");
                        row.innerHTML = `<td>${c.name}</td><td>${c.sharedCount}</td><td>${c.sharedCourses.join(", ")}</td>`;
                        tbody.appendChild(row);
                    });
                }
            </script>
        </div>
    </body>
</html>
