<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            href="https://bootswatch.com/5/brite/bootstrap.min.css"
            rel="stylesheet"
            type="text/css"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
            integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
            crossorigin="anonymous"
        ></script>
        <title>Classmates Shared Courses</title>
        <style>
            body::-webkit-scrollbar {
                display: none;
            }
        </style>
    </head>
    <body>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img
                        src="https://www.svgrepo.com/show/299039/group-team.svg"
                        alt="Logo"
                        width="30"
                        height="30"
                        class="d-inline-block align-text-top"
                    />
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarColor01"
                    aria-controls="navbarColor01"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarColor01">
                    <ul class="navbar-nav">
                        <li><span class="nav-link">Friend Finder</span></li>
                    </ul>
                    <form
                        onsubmit="
                            event.preventDefault();
                            loadClassmates();
                        "
                        class="flex-grow-1"
                    >
                        <div class="d-flex gap-2">
                            <input
                                type="text"
                                id="termInput"
                                class="form-control flex-grow-1"
                                placeholder="Input a school year and term - i.e. 1252 for A.Y. '25-'26, term 2"
                                aria-label="Sizing example input"
                                aria-describedby="inputGroup-sizing-default"
                                maxlength="4"
                            />
                            <button onclick="submit" class="btn btn-warning">
                                Load
                            </button>
                        </div>
                    </form>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a
                                class="nav-link d-flex align-items-center gap-2 text-white"
                                href="https://github.com/rea-prince/FriendFinder"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                <img
                                    src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/github-white-icon.png"
                                    alt="GitHub"
                                    width="24"
                                    height="24"
                                />
                                GitHub
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container my-4">
            <table
                class="table table-sm table-hover table-striped"
                id="results"
                style="
                    width: 100%;
                    margin-bottom: 0;
                    border-collapse: separate;
                    border-spacing: 0;
                "
            >
                <thead>
                    <tr class="table-warning">
                        <th
                            scope="row"
                            style="
                                position: sticky;
                                top: 0;
                                z-index: 10;
                                text-align: center;
                                border-bottom: 2px solid #000000;
                                padding: 10px;
                            "
                        >
                            #
                        </th>
                        <th
                            scope="row"
                            style="
                                position: sticky;
                                top: 0;
                                z-index: 10;
                                text-align: center;
                                border-bottom: 2px solid #000000;
                                padding: 10px;
                            "
                        >
                            Name
                        </th>
                        <th
                            style="
                                position: sticky;
                                top: 0;
                                z-index: 10;
                                text-align: center;
                                border-bottom: 2px solid #000000;
                                padding: 10px;
                            "
                        >
                            # of Courses
                        </th>
                        <th
                            style="
                                position: sticky;
                                top: 0;
                                z-index: 10;
                                text-align: center;
                                border-bottom: 2px solid #000000;
                                padding: 10px;
                            "
                        >
                            Mutual Courses
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <script>
                        document.addEventListener("DOMContentLoaded", () => {
                            const cachedData =
                                sessionStorage.getItem("classmatesData");
                            if (cachedData) {
                                const lastTerm =
                                    sessionStorage.getItem("lastTerm");
                                if (lastTerm)
                                    document.getElementById("termInput").value =
                                        lastTerm;
                                renderTable(JSON.parse(cachedData));
                            }
                        });

                        async function loadClassmates() {
                            const term =
                                document.getElementById("termInput").value;
                            console.log("Sending termYearCode:", term);

                            const response = await fetch("/api/classmates", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    searchQuery: termInput.value,
                                }),
                            });

                            if (!response.ok) {
                                console.error(
                                    "Fetch error:",
                                    response.statusText,
                                );
                                return;
                            }

                            const data = await response.json();
                            console.log("Received data:", data);

                            // store in sessionStorage
                            sessionStorage.setItem(
                                "classmatesData",
                                JSON.stringify(data),
                            );
                            sessionStorage.setItem("lastTerm", term);

                            renderTable(data);
                        }

                        function renderTable(data) {
                            let ctr = 1;
                            const tbody =
                                document.querySelector("#results tbody");
                            tbody.innerHTML = "";
                            data.forEach((c) => {
                                const row = document.createElement("tr");
                                row.innerHTML = `
                                <td style="text-align: right; font-size: 1rem;">${ctr}</td>
                                <td style="text-align: right; font-size: 1rem;">${c.name}</td>
                                <td style="font-weight: bold; font-size: 1rem; text-align: center;">${c.sharedCount}</td>
                                <td style="list-style-type: none; font-size: 1rem;"">
                                    ${c.sharedCourses
                                        .map((course) => {
                                            return `<li>${course}</li>`;
                                        })
                                        .join("")}
                                </td>
                            `;
                                tbody.appendChild(row);
                                ctr++;
                            });
                        }
                    </script>
                </tbody>
            </table>
        </div>
    </body>
</html>
